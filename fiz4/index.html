
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PHYSICS LAB PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<button id="menuToggle" onclick="toggleMenu()">☰</button>

<div id="app">
  <aside>
    <header>
      <div class="logo">⚛</div>
      <h2>PHYSICS LAB PRO</h2>
      <b id="topicNumber"></b>
      <small>1-КУРС · 80 МИНУТ</small>
    </header>

    <section class="panel">
      <strong id="pageCount"></strong>
      <div class="row">
        <button onclick="go(-1)">← Артқа</button>
        <button onclick="go(1)" class="primary">Келесі →</button>
      </div>
      <progress id="progress" max="100"></progress>
    </section>

    <section class="panel">
      <label>ЭКРАН МАСШТАБЫ</label>
      <div class="row">
        <button onclick="zoom(-25)">−</button>
        <b id="scale">100%</b>
        <button onclick="zoom(25)">+</button>
      </div>
      <button onclick="zoom(0)">100% — Қайтару</button>
      <button onclick="fullscreen()">⛶ Толық экран</button>
      <button onclick="toggleMenu()">◀ Мәзірді жасыру</button>
    </section>

    <section class="panel">
      <label>САБАҚ ТАЙМЕРІ</label>
      <strong id="timer">80:00</strong>
      <div class="row">
        <button id="timerBtn" onclick="toggleTimer()">Бастау</button>
        <button onclick="resetTimer()">Қайтару</button>
      </div>
    </section>

    <section class="panel">
      <label>ОҚУШЫЛАР</label>
      <b id="attendanceCount"></b>
      <button onclick="openPanel('attendance')">Қатысу тізімі</button>
      <button onclick="randomStudent()">🎲 Рандом оқушы</button>
      <button onclick="openPanel('taskPanel')">24 жеке есеп</button>
      <button onclick="reshuffle()">Есептерді араластыру</button>
      <button onclick="openPanel('teamPanel')">3 команда</button>
    </section>

    <section class="panel">
      <label>САБАҚ БӨЛІМДЕРІ</label>
      <nav id="menu"></nav>
    </section>

    <section class="panel">
      <label>ҚҰРАЛДАР</label>
      <button onclick="openBoard()">✎ Интерактивті тақта</button>
      <button onclick="openPanel('mathPanel')">Математика</button>
      <button onclick="openPanel('physicsPanel')">Физика</button>
      <button onclick="readPage()">🔊 Дауыстап оқу</button>
      <button onclick="stopReading()">■ Тоқтату</button>
    </section>

    <section class="clock">
      <small>АЛМАТЫ · UTC+5</small>
      <strong id="clock"></strong>
      <small id="date"></small>
    </section>
    <footer>BY DARKHAN</footer>
  </aside>

  <main id="screen"><div id="stage"></div></main>
</div>

<section id="attendance" class="floating wide hidden">
  <div class="handle">Қатысу тізімі
    <button onclick="closePanel('attendance')">×</button>
  </div>
  <div class="row">
    <button onclick="markAll(true)">Барлығы бар</button>
    <button onclick="markAll(false)">Барлығы жоқ</button>
  </div>
  <div id="students"></div>
  <button class="primary" onclick="saveAttendance()">Сақтау</button>
</section>

<section id="taskPanel" class="floating wide hidden">
  <div class="handle">Жеке есептер
    <button onclick="closePanel('taskPanel')">×</button>
  </div>
  <p id="taskCount"></p>
  <div id="taskList"></div>
  <button onclick="reshuffle()">Қайта араластыру</button>
</section>

<section id="randomPanel" class="floating hidden">
  <div class="handle">Рандом оқушы
    <button onclick="closePanel('randomPanel')">×</button>
  </div>
  <h2 id="randomName"></h2>
  <button onclick="openRandomTask()">Есебін ашу</button>
  <button onclick="randomStudent()">Келесі оқушы</button>
</section>

<section id="teamPanel" class="floating wide hidden">
  <div class="handle">Командалар
    <button onclick="closePanel('teamPanel')">×</button>
  </div>
  <div id="teams"></div>
  <button onclick="makeTeams(true)">Қайта бөлу</button>
</section>

<section id="mathPanel" class="floating mini hidden">
  <div class="handle">МАТЕМАТИКА
    <button onclick="closePanel('mathPanel')">×</button>
  </div>
  <input id="mathDisplay" readonly>
  <div id="mathKeys"></div>
  <div id="mathResult" class="result">0</div>
</section>

<section id="physicsPanel" class="floating mini hidden">
  <div class="handle">ФИЗИКА
    <button onclick="closePanel('physicsPanel')">×</button>
  </div>
  <select id="physicsFormula" onchange="physicsInputs()"></select>
  <div id="physicsInputs"></div>
  <button class="primary" onclick="calculatePhysics()">Есептеу</button>
  <div id="physicsResult" class="result"></div>
</section>

<section id="board" class="hidden">
  <header class="boardHeader">
    <b>PHYSICS WHITEBOARD PRO</b>
    <button onclick="closeBoard()">✕ Сабаққа қайту</button>
  </header>
  <div class="boardTools">
    <label>ТҮС</label>
    <input id="ink" type="color" value="#19364f">
    <label>ҚАЛЫҢДЫҒЫ</label>
    <input id="penSize" type="range" min="1" max="40" value="5">

    <button onclick="setTool('pen')">Қалам</button>
    <button onclick="setTool('marker')">Маркер</button>
    <button onclick="setTool('eraser')">Өшіргіш</button>
    <button onclick="setTool('text')">Мәтін</button>
    <button onclick="setTool('line')">Түзу сызық</button>
    <button onclick="setTool('arrow')">Бағдарша</button>
    <button onclick="setTool('rect')">Төртбұрыш</button>
    <button onclick="setTool('circle')">Эллипс</button>
    <button onclick="setTool('triangle')">Үшбұрыш</button>
    <button onclick="setTool('hand')">Жылжыту</button>
    <button onclick="toggleGrid()">Торкөз</button>

    <label>БЕТТЕР</label>
    <div class="row">
      <button onclick="boardPage(-1)">◀</button>
      <b id="boardCount">1/1</b>
      <button onclick="boardPage(1)">▶</button>
    </div>
    <button onclick="newBoardPage()">+ Жаңа бет</button>
    <button onclick="deleteBoardPage()">Бетті өшіру</button>

    <div class="row">
      <button onclick="undo()">↶</button>
      <button onclick="redo()">↷</button>
    </div>

    <label>МАСШТАБ</label>
    <div class="row">
      <button onclick="boardZoom(-25)">−</button>
      <b id="boardScale">100%</b>
      <button onclick="boardZoom(25)">+</button>
    </div>
    <button onclick="boardZoom(0)">100%</button>
    <button onclick="clearBoard()">Тазалау</button>
    <button onclick="$('imageInput').click()">Сурет қосу</button>
    <input type="file" id="imageInput" accept="image/*" hidden
      onchange="importImage(event)">
    <button onclick="saveBoard()">PNG сақтау</button>
    <button onclick="openPanel('mathPanel')">Математика</button>
    <button onclick="openPanel('physicsPanel')">Физика</button>
  </div>

  <div id="boardViewport">
    <div id="paper">
      <canvas id="canvas" width="1600" height="900"></canvas>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
